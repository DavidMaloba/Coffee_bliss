<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Bliss</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Coffee Bliss</h1>
    <p>Fresh coffee and delicious breakfast just for you.</p>
  </header>

  <div id="closedBanner" class="closed-banner hidden"></div>

  <div class="top-bar">
    <span class="menu-toggle" onclick="toggleMenu()">☰</span>
    <button class="toggle-mode" onclick="toggleMode()">🌙/☀️</button>
  </div>

  <nav id="navbar">
    <button onclick="filterMenu('all', this)" class="active">Show All</button>
    <button onclick="filterMenu('breakfast', this)">Breakfast</button>
    <button onclick="filterMenu('beverages', this)">Beverages</button>
  </nav>

  <div class="controls">
    <input type="text" id="search" placeholder="Search menu..." oninput="filterItems()">
    <select id="sort" onchange="filterItems()">
      <option value="default">Sort By</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </div>

  <section id="menu" class="menu-grid"></section>

  <div class="cart">
    <h2>🛒 Cart</h2>
    <div id="cart-items"></div>
    <div class="cart-total" id="cart-total">Total: KSh 0</div>
    <button id="checkoutBtn" onclick="checkout()">Checkout</button>
  </div>

  <div id="orderModal" class="order-overlay hidden" onclick="if (event.target === this) closeOrder()">
    <div class="order-modal">
      <h2>Send your order</h2>
      <p class="order-sub">We will open WhatsApp with your order ready to send.</p>
      <label for="orderName">Your name</label>
      <input type="text" id="orderName" placeholder="e.g. David" maxlength="80" />
      <label for="orderNote">Note (pickup, delivery location, etc.)</label>
      <textarea id="orderNote" placeholder="Optional" maxlength="300"></textarea>
      <div class="order-err" id="orderErr"></div>
      <div class="order-actions">
        <button class="order-cancel" onclick="closeOrder()">Cancel</button>
        <button class="order-send" onclick="submitOrder()">Send on WhatsApp</button>
      </div>
    </div>
  </div>

  <footer>
    <p>Contact us: +254-768-649-781 | 123 Brew Lane</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBACx3oRCEm49TwGR7jCJBtfACTSWmMykc",
      authDomain: "coffee-bliss-30203.firebaseapp.com",
      projectId: "coffee-bliss-30203",
      storageBucket: "coffee-bliss-30203.firebasestorage.app",
      messagingSenderId: "1080816917801",
      appId: "1:1080816917801:web:70bc310117c4f58ac5eb38"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <script>
    const defaultItems = [
      { title: "Pancakes", category: "breakfast", price: 599, img: "image/pancakes.jpg", desc: "Fluffy pancakes with maple syrup" },
      { title: "Croissant", category: "breakfast", price: 299, img: "image/croissant.jpg", desc: "Buttery flaky croissant" },
      { title: "Waffles", category: "breakfast", price: 650, img: "image/waffles.jpg", desc: "Crispy waffles with berries" },
      { title: "Bagel & Cream Cheese", category: "breakfast", price: 375, img: "image/bagel.jpg", desc: "Toasted bagel with cream cheese" },
      { title: "Fruit Bowl", category: "breakfast", price: 399, img: "image/fruit-bowl.jpg", desc: "Fresh seasonal fruits" },
      { title: "Caramel Latte", category: "beverages", price: 450, img: "image/caramel-latte.jpg", desc: "Rich espresso with caramel syrup" },
      { title: "Iced Coffee", category: "beverages", price: 399, img: "image/iced-coffee.jpg", desc: "Chilled brewed coffee served with ice" },
      { title: "Mocha", category: "beverages", price: 475, img: "image/mocha.jpg", desc: "Chocolate-infused espresso" },
      { title: "Espresso", category: "beverages", price: 250, img: "image/espresso.jpg", desc: "Strong and bold espresso shot" }
    ];

    let menuItems = [];
    let currentCategory = "all";
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderMenu(items) {
      const menu = document.getElementById("menu");
      menu.innerHTML = "";
      if (items.length === 0) {
        menu.innerHTML = "<p style='grid-column:1/-1;text-align:center;padding:20px'>No items found.</p>";
        return;
      }
      items.forEach(item => {
        const div = document.createElement("div");
        div.className = "menu-item" + (item.soldOut ? " sold-out" : "");
        div.innerHTML = `
          <img src="${esc(item.img)}" alt="${esc(item.title)}">
          <h3>${esc(item.title)}</h3>
          <p>${esc(item.desc)} - KSh ${Number(item.price).toLocaleString()}</p>
          ${item.soldOut
            ? '<button class="sold-btn" disabled>Sold out</button>'
            : `<button onclick="addToCart('${esc(item.id)}')">Add to Cart</button>`}
        `;
        menu.appendChild(div);
      });
    }

    async function loadMenu() {
      const menu = document.getElementById("menu");
      menu.innerHTML = "<p style='grid-column:1/-1;text-align:center;padding:20px'>Loading menu...</p>";
      try {
        const snap = await db.collection("menu").get();
        menuItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (err) {
        console.error("Could not load menu:", err);
        menuItems = [];
      }
      // Nothing in the database yet (or it failed): show the starter menu
      if (menuItems.length === 0) {
        menuItems = defaultItems.map((item, i) => ({ id: "default-" + i, ...item }));
      }
      filterItems();
    }

    function addToCart(id) {
      const item = menuItems.find(i => i.id === id);
      if (!item || item.soldOut) return;
      const existing = cart.find(i => i.id === id);
      if (existing) existing.qty++;
      else cart.push({ id: item.id, title: item.title, price: Number(item.price), qty: 1 });
      updateCart();
    }

    function updateCart() {
      const cartContainer = document.getElementById("cart-items");
      const cartTotal = document.getElementById("cart-total");
      cartContainer.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price * item.qty;
        cartContainer.innerHTML += `
          <div class="cart-item">
            <span>${esc(item.title)}</span>
            <input type="number" min="1" value="${item.qty}" onchange="updateQty(${index}, this.value)">
            <span>KSh ${(item.price * item.qty).toLocaleString()}</span>
            <button onclick="removeItem(${index})">❌</button>
          </div>
        `;
      });

      cartTotal.textContent = `Total: KSh ${total.toLocaleString()}`;
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function updateQty(index, qty) {
      cart[index].qty = parseInt(qty);
      if (cart[index].qty < 1) cart[index].qty = 1;
      updateCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCart();
    }

    // Orders go to this WhatsApp number (country code first, no + or spaces)
    const WHATSAPP_NUMBER = "254768649781";

    // Open/closed switch (controlled from the admin page)
    let storeOpen = true;
    let closedMessage = "We are closed right now. Please check back later.";

    db.collection("settings").doc("store").onSnapshot(doc => {
      const data = doc.exists ? doc.data() : {};
      storeOpen = data.open !== false;
      closedMessage = data.message || "We are closed right now. Please check back later.";

      const banner = document.getElementById("closedBanner");
      banner.textContent = closedMessage;
      banner.classList.toggle("hidden", storeOpen);

      const btn = document.getElementById("checkoutBtn");
      btn.disabled = !storeOpen;
      btn.textContent = storeOpen ? "Checkout" : "Closed";
      if (!storeOpen) closeOrder();
    }, err => console.error("Could not read store status:", err));

    function checkout() {
      if (!storeOpen) return alert(closedMessage);
      if (cart.length === 0) return alert("Your cart is empty.");
      document.getElementById("orderErr").textContent = "";
      document.getElementById("orderModal").classList.remove("hidden");
    }

    function closeOrder() {
      document.getElementById("orderModal").classList.add("hidden");
    }

    function submitOrder() {
      if (!storeOpen) return alert(closedMessage);
      const name = document.getElementById("orderName").value.trim();
      const note = document.getElementById("orderNote").value.trim();
      if (!name) {
        document.getElementById("orderErr").textContent = "Please enter your name.";
        return;
      }

      const lines = cart.map(i => "• " + i.qty + " x " + i.title + " - KSh " + (i.price * i.qty).toLocaleString());
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      const text = "Hello Coffee Bliss! I would like to order:\n\n" + lines.join("\n") +
        "\n\nTotal: KSh " + total.toLocaleString() +
        "\n\nName: " + name + (note ? "\nNote: " + note : "");

      // Open WhatsApp first (so the browser does not block it), then save a copy of the order
      window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text), "_blank");

      db.collection("orders").add({
        name: name,
        note: note,
        items: cart.map(i => ({ title: i.title, qty: i.qty, price: i.price })),
        total: total,
        status: "new",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(err => console.error("Could not save order:", err));

      cart = [];
      updateCart();
      closeOrder();
      document.getElementById("orderNote").value = "";
    }

    function filterMenu(category, btn) {
      currentCategory = category;
      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterItems();
    }

    function filterItems() {
      let filtered = [...menuItems];

      if (currentCategory !== "all") {
        filtered = filtered.filter(item => item.category === currentCategory);
      }

      const search = document.getElementById("search").value.toLowerCase();
      if (search) {
        filtered = filtered.filter(item => item.title.toLowerCase().includes(search));
      }

      const sort = document.getElementById("sort").value;
      if (sort === "low") {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sort === "high") {
        filtered.sort((a, b) => b.price - a.price);
      }

      renderMenu(filtered);
    }

    function toggleMenu() {
      document.getElementById("navbar").classList.toggle("active");
    }

    function toggleMode() {
      document.body.classList.toggle("dark");
    }

    window.onload = () => {
      loadMenu();
      updateCart();
    };
  </script>
</body>
</html>
