<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Coffee Bliss</title>
  <style>
    :root {
      --espresso: #3b2417;
      --roast: #5a3a28;
      --cream: #faf6f1;
      --card: #ffffff;
      --line: #eadfd3;
      --accent: #c8873a;
      --accent-dark: #a96d27;
      --text: #2b2420;
      --muted: #7a6b60;
      --green: #2e7d32;
      --red: #c0392b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
    .hidden { display: none !important; }
    button { font-family: inherit; cursor: pointer; }

    /* ---------- Login ---------- */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(160deg, var(--espresso), var(--roast)); }
    .login-card { background: var(--card); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
    .login-card .logo { font-size: 44px; }
    .login-card h1 { margin: 8px 0 4px; color: var(--espresso); font-size: 1.5rem; }
    .login-card p { color: var(--muted); margin-bottom: 22px; font-size: .95rem; }
    .btn-google { width: 100%; padding: 12px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 1rem; font-weight: 600; color: var(--text); }
    .btn-google:hover { background: #f7f2ec; }
    .login-msg { color: var(--red); margin-top: 14px; font-size: .9rem; min-height: 1.2em; }

    /* ---------- Top bar ---------- */
    .topbar { background: var(--espresso); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 20; }
    .brand { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    .brand small { font-weight: 400; opacity: .7; font-size: .75rem; }
    .user { display: flex; align-items: center; gap: 10px; font-size: .8rem; }
    .user span { opacity: .8; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-out { background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: .8rem; }
    .btn-out:hover { background: rgba(255,255,255,.12); }

    main { max-width: 1000px; margin: 0 auto; padding: 16px; }

    /* ---------- Stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .stat .num { font-size: 1.6rem; font-weight: 700; color: var(--espresso); }
    .stat .lbl { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }

    /* ---------- Toolbar ---------- */
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .toolbar input, .toolbar select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: .95rem; background: #fff; font-family: inherit; }
    .toolbar input { flex: 1 1 160px; min-width: 0; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: .95rem; }
    .btn:hover { background: var(--accent-dark); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn.ghost:hover { background: #f1e9df; }

    /* ---------- Items ---------- */
    .items { display: flex; flex-direction: column; gap: 10px; }
    .row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; }
    .row img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: #eee; flex-shrink: 0; }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-weight: 700; color: var(--espresso); }
    .row .desc { font-size: .82rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .badge { font-size: .7rem; padding: 3px 8px; border-radius: 999px; background: #f3e6d6; color: var(--roast); text-transform: capitalize; font-weight: 600; }
    .price { font-weight: 700; font-size: .9rem; }
    .actions { display: flex; flex-direction: column; gap: 6px; }
    .actions button { border: 1px solid var(--line); background: #fff; padding: 6px 12px; border-radius: 8px; font-size: .8rem; font-weight: 600; }
    .actions .edit:hover { background: #eaf6ec; border-color: var(--green); color: var(--green); }
    .actions .del:hover { background: #fdeceb; border-color: var(--red); color: var(--red); }

    .badge.sold { background: #fdeceb; color: var(--red); }
    .row.out img { filter: grayscale(1); opacity: .55; }
    .actions .stock:hover { background: #fff6e5; border-color: var(--accent); color: var(--accent-dark); }

    .store-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border-radius: 12px; margin-bottom: 14px; border: 1px solid var(--line); background: #eaf6ec; }
    .store-bar.closed { background: #fdeceb; }
    .store-bar strong { display: block; color: var(--espresso); }
    .store-bar small { color: var(--muted); font-size: .78rem; }
    .store-bar .btn { flex-shrink: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 10px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-weight: 700; font-size: .95rem; color: var(--muted); }
    .tab.active { background: var(--espresso); color: #fff; border-color: var(--espresso); }
    .count { display: inline-block; min-width: 20px; padding: 1px 6px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: #fff; font-size: .75rem; }

    .order { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .order.done { opacity: .65; }
    .order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .order-name { font-weight: 700; color: var(--espresso); }
    .order-time { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .order ul { list-style: none; margin: 10px 0; font-size: .9rem; }
    .order li { padding: 3px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 10px; }
    .order .note { font-size: .85rem; background: #faf3e8; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
    .order-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .order-total { font-weight: 700; }
    .order-actions { display: flex; gap: 6px; }
    .order-actions button { border: 1px solid var(--line); background: #fff; padding: 6px 12px; border-radius: 8px; font-size: .8rem; font-weight: 600; }
    .order-actions .done-btn:hover { background: #eaf6ec; border-color: var(--green); color: var(--green); }
    .order-actions .del:hover { background: #fdeceb; border-color: var(--red); color: var(--red); }
    .badge.new { background: #e8f1ff; color: #1d5fb8; }
    .badge.finished { background: #eaf6ec; color: var(--green); }

    .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 30px 16px; text-align: center; color: var(--muted); }
    .empty h3 { color: var(--espresso); margin-bottom: 6px; }
    .empty .btn { margin-top: 14px; }

    /* ---------- Modal ---------- */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
    .modal { background: #fff; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 20px; max-height: 92vh; overflow-y: auto; }
    .modal h2 { color: var(--espresso); margin-bottom: 14px; font-size: 1.15rem; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 1rem; font-family: inherit; background: #fff; }
    .field textarea { resize: vertical; min-height: 70px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .preview { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 12px; background: #f3ece4; }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .modal-actions .btn { flex: 1; }
    .hint { font-size: .75rem; color: var(--muted); margin-top: 4px; }
    .field input[type=file] { padding: 8px; }
    .form-err { color: var(--red); font-size: .85rem; min-height: 1.1em; margin-bottom: 8px; }

    /* ---------- Toast ---------- */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--espresso); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 100; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .toast.err { background: var(--red); }

    @media (min-width: 640px) {
      .overlay { align-items: center; }
      .modal { border-radius: 16px; }
      .stat .num { font-size: 2rem; }
      .actions { flex-direction: row; }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="logo">&#9749;</div>
      <h1>Coffee Bliss Admin</h1>
      <p>Sign in to manage your menu.</p>
      <button class="btn-google" onclick="login()">Sign in with Google</button>
      <div class="login-msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="appView" class="hidden">
    <div class="topbar">
      <div class="brand">&#9749; Coffee Bliss <small>Admin</small></div>
      <div class="user">
        <span id="userEmail"></span>
        <button class="btn-out" onclick="logout()">Sign out</button>
      </div>
    </div>

    <main>
      <div class="store-bar" id="storeBar">
        <div>
          <strong id="storeState">Store is open</strong>
          <small id="storeHint">Customers can place orders.</small>
        </div>
        <button class="btn" id="storeBtn" onclick="toggleStore()">Close store</button>
      </div>

      <div class="tabs">
        <button class="tab active" id="tabMenu" onclick="showTab('menu')">Menu</button>
        <button class="tab" id="tabOrders" onclick="showTab('orders')">Orders <span class="count hidden" id="newCount">0</span></button>
      </div>

      <div id="menuPane">
      <div class="stats">
        <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total items</div></div>
        <div class="stat"><div class="num" id="statBreakfast">0</div><div class="lbl">Breakfast</div></div>
        <div class="stat"><div class="num" id="statBeverages">0</div><div class="lbl">Beverages</div></div>
      </div>

      <div class="toolbar">
        <input type="text" id="search" placeholder="Search items..." oninput="renderItems()" />
        <select id="filter" onchange="renderItems()">
          <option value="all">All</option>
          <option value="breakfast">Breakfast</option>
          <option value="beverages">Beverages</option>
        </select>
        <button class="btn" onclick="openModal()">+ Add item</button>
      </div>

      <div class="items" id="items"></div>
      </div>

      <div id="ordersPane" class="hidden">
        <div class="items" id="orders"></div>
      </div>
    </main>
  </div>

  <!-- Add / edit modal -->
  <div id="overlay" class="overlay hidden" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2 id="modalTitle">Add menu item</h2>
      <img id="preview" class="preview hidden" alt="Image preview" />
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Pancakes" />
      </div>
      <div class="two">
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="breakfast">Breakfast</option>
            <option value="beverages">Beverages</option>
          </select>
        </div>
        <div class="field">
          <label for="price">Price (KSh)</label>
          <input type="number" id="price" placeholder="450" min="0" />
        </div>
      </div>
      <div class="field">
        <label for="file">Photo</label>
        <input type="file" id="file" accept="image/*" onchange="pickPhoto(this)" />
        <div class="hint">Pick a photo from your phone. It is resized automatically.</div>
      </div>
      <div class="field">
        <label for="img">Or image path</label>
        <input type="text" id="img" placeholder="image/pancakes.jpg" oninput="photoData = null; updatePreview()" />
      </div>
      <div class="field">
        <label for="desc">Description</label>
        <textarea id="desc" placeholder="Short description"></textarea>
      </div>
      <div class="form-err" id="formErr"></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Cancel</button>
        <button class="btn" id="saveBtn" onclick="saveItem()">Save</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBACx3oRCEm49TwGR7jCJBtfACTSWmMykc",
      authDomain: "coffee-bliss-30203.firebaseapp.com",
      projectId: "coffee-bliss-30203",
      storageBucket: "coffee-bliss-30203.firebasestorage.app",
      messagingSenderId: "1080816917801",
      appId: "1:1080816917801:web:70bc310117c4f58ac5eb38"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const OWNER_EMAIL = "dmaloba903@gmail.com";

    const starterItems = [
      { title: "Pancakes", category: "breakfast", price: 599, img: "image/pancakes.jpg", desc: "Fluffy pancakes with maple syrup" },
      { title: "Croissant", category: "breakfast", price: 299, img: "image/croissant.jpg", desc: "Buttery flaky croissant" },
      { title: "Waffles", category: "breakfast", price: 650, img: "image/waffles.jpg", desc: "Crispy waffles with berries" },
      { title: "Bagel & Cream Cheese", category: "breakfast", price: 375, img: "image/bagel.jpg", desc: "Toasted bagel with cream cheese" },
      { title: "Fruit Bowl", category: "breakfast", price: 399, img: "image/fruit-bowl.jpg", desc: "Fresh seasonal fruits" },
      { title: "Caramel Latte", category: "beverages", price: 450, img: "image/caramel-latte.jpg", desc: "Rich espresso with caramel syrup" },
      { title: "Iced Coffee", category: "beverages", price: 399, img: "image/iced-coffee.jpg", desc: "Chilled brewed coffee served with ice" },
      { title: "Mocha", category: "beverages", price: 475, img: "image/mocha.jpg", desc: "Chocolate-infused espresso" },
      { title: "Espresso", category: "beverages", price: 250, img: "image/espresso.jpg", desc: "Strong and bold espresso shot" }
    ];

    let items = [];
    let editId = null;
    let unsubscribe = null;
    let unsubOrders = null;
    let unsubStore = null;
    let store = { open: true, message: "" };
    let orders = [];
    let ordersLoaded = false;
    let loaded = false;
    let photoData = null; // resized photo picked from the phone (data URL)

    const $ = id => document.getElementById(id);

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function toast(text, isError) {
      const t = document.createElement("div");
      t.className = "toast" + (isError ? " err" : "");
      t.textContent = text;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    /* ---------- Login ---------- */
    function login() {
      $("loginMsg").textContent = "";
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
        $("loginMsg").textContent = "Login failed: " + err.message;
      });
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      if (unsubOrders) { unsubOrders(); unsubOrders = null; }
      if (unsubStore) { unsubStore(); unsubStore = null; }
      loaded = false;
      ordersLoaded = false;

      if (!user) {
        $("appView").classList.add("hidden");
        $("loginView").classList.remove("hidden");
        return;
      }

      if (user.email !== OWNER_EMAIL) {
        $("loginMsg").textContent = user.email + " is not allowed to edit this menu.";
        auth.signOut();
        return;
      }

      $("loginView").classList.add("hidden");
      $("appView").classList.remove("hidden");
      $("userEmail").textContent = user.email;
      renderItems();

      unsubscribe = db.collection("menu").orderBy("title").onSnapshot(snap => {
        items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        loaded = true;
        renderItems();
      }, err => toast("Could not load menu: " + err.message, true));

      unsubOrders = db.collection("orders").orderBy("createdAt", "desc").limit(100).onSnapshot(snap => {
        orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        ordersLoaded = true;
        renderOrders();
      }, err => toast("Could not load orders: " + err.message, true));

      unsubStore = db.collection("settings").doc("store").onSnapshot(doc => {
        store = doc.exists ? { open: true, message: "", ...doc.data() } : { open: true, message: "" };
        renderStore();
      }, err => toast("Could not load store status: " + err.message, true));
    });

    /* ---------- Open / closed switch ---------- */
    function renderStore() {
      const isOpen = store.open !== false;
      $("storeBar").classList.toggle("closed", !isOpen);
      $("storeState").textContent = isOpen ? "Store is open" : "Store is closed";
      $("storeHint").textContent = isOpen
        ? "Customers can place orders."
        : (store.message || "Customers cannot place orders.");
      $("storeBtn").textContent = isOpen ? "Close store" : "Open store";
    }

    async function toggleStore() {
      const isOpen = store.open !== false;
      let message = "";
      if (isOpen) {
        const answer = prompt("Message for customers (optional):", "We are closed right now. Please check back later.");
        if (answer === null) return;
        message = answer.trim();
      }
      try {
        await db.collection("settings").doc("store").set({ open: !isOpen, message: message });
        toast(isOpen ? "Store closed" : "Store open");
      } catch (err) {
        toast("Could not update: " + err.message, true);
      }
    }

    /* ---------- Tabs ---------- */
    function showTab(tab) {
      $("menuPane").classList.toggle("hidden", tab !== "menu");
      $("ordersPane").classList.toggle("hidden", tab !== "orders");
      $("tabMenu").classList.toggle("active", tab === "menu");
      $("tabOrders").classList.toggle("active", tab === "orders");
    }

    /* ---------- Orders ---------- */
    function renderOrders() {
      const fresh = orders.filter(o => o.status === "new").length;
      const badge = $("newCount");
      badge.textContent = fresh;
      badge.classList.toggle("hidden", fresh === 0);

      const box = $("orders");
      if (!ordersLoaded) { box.innerHTML = '<div class="empty">Loading orders...</div>'; return; }
      if (orders.length === 0) {
        box.innerHTML = '<div class="empty"><h3>No orders yet</h3><p>Orders will show up here when customers tap Send on WhatsApp.</p></div>';
        return;
      }

      box.innerHTML = orders.map(o => {
        const when = (o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : new Date())
          .toLocaleString("en-KE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        const isDone = o.status === "done";
        const lines = (o.items || []).map(i =>
          "<li><span>" + esc(i.qty) + " x " + esc(i.title) + "</span><span>KSh " + (Number(i.price) * Number(i.qty)).toLocaleString() + "</span></li>"
        ).join("");
        return `
          <div class="order${isDone ? " done" : ""}">
            <div class="order-head">
              <div>
                <div class="order-name">${esc(o.name)}</div>
                <div class="order-time">${esc(when)}${o.type ? " · " + (o.type === "delivery" ? "Delivery" : "Pickup") : ""}</div>
              </div>
              <span class="badge ${isDone ? "finished" : "new"}">${isDone ? "Done" : "New"}</span>
            </div>
            <ul>${lines}</ul>
            ${o.note ? '<div class="note">' + esc(o.note) + "</div>" : ""}
            <div class="order-foot">
              <div class="order-total">Total: KSh ${Number(o.total).toLocaleString()}</div>
              <div class="order-actions">
                <button class="done-btn" onclick="toggleOrder('${esc(o.id)}')">${isDone ? "Reopen" : "Mark done"}</button>
                <button class="del" onclick="deleteOrder('${esc(o.id)}')">Delete</button>
              </div>
            </div>
          </div>`;
      }).join("");
    }

    async function toggleOrder(id) {
      const o = orders.find(x => x.id === id);
      if (!o) return;
      try {
        await db.collection("orders").doc(id).update({ status: o.status === "done" ? "new" : "done" });
      } catch (err) {
        toast("Could not update: " + err.message, true);
      }
    }

    async function deleteOrder(id) {
      if (!confirm("Delete this order?")) return;
      try {
        await db.collection("orders").doc(id).delete();
        toast("Order deleted");
      } catch (err) {
        toast("Could not delete: " + err.message, true);
      }
    }

    /* ---------- List ---------- */
    function renderItems() {
      $("statTotal").textContent = items.length;
      $("statBreakfast").textContent = items.filter(i => i.category === "breakfast").length;
      $("statBeverages").textContent = items.filter(i => i.category === "beverages").length;

      const q = $("search").value.trim().toLowerCase();
      const f = $("filter").value;
      const list = items.filter(i =>
        (f === "all" || i.category === f) &&
        (!q || i.title.toLowerCase().includes(q))
      );

      const box = $("items");

      if (!loaded) {
        box.innerHTML = '<div class="empty">Loading menu...</div>';
        return;
      }

      if (items.length === 0) {
        box.innerHTML = `
          <div class="empty">
            <h3>Your menu is empty</h3>
            <p>Load the 9 starter items into the database, or add your first item.</p>
            <button class="btn" onclick="importStarter()">Import starter menu</button>
          </div>`;
        return;
      }

      if (list.length === 0) {
        box.innerHTML = '<div class="empty">No items match your search.</div>';
        return;
      }

      box.innerHTML = list.map(item => `
        <div class="row${item.soldOut ? " out" : ""}">
          <img src="${esc(item.img)}" alt="">
          <div class="info">
            <div class="name">${esc(item.title)}</div>
            <div class="desc">${esc(item.desc)}</div>
            <div class="meta">
              <span class="badge">${esc(item.category)}</span>
              ${item.soldOut ? '<span class="badge sold">Sold out</span>' : ""}
              <span class="price">KSh ${Number(item.price).toLocaleString()}</span>
            </div>
          </div>
          <div class="actions">
            <button class="stock" onclick="toggleSoldOut('${esc(item.id)}')">${item.soldOut ? "Back in stock" : "Sold out"}</button>
            <button class="edit" onclick="openModal('${esc(item.id)}')">Edit</button>
            <button class="del" onclick="deleteItem('${esc(item.id)}')">Delete</button>
          </div>
        </div>
      `).join("");
    }

    /* ---------- Modal ---------- */
    function openModal(id) {
      editId = id || null;
      const item = id ? items.find(i => i.id === id) : null;
      $("modalTitle").textContent = item ? "Edit menu item" : "Add menu item";
      $("title").value = item ? item.title : "";
      $("category").value = item ? item.category : "breakfast";
      $("price").value = item ? item.price : "";
      photoData = null;
      $("file").value = "";
      if (item && item.img && item.img.startsWith("data:")) {
        photoData = item.img;
        $("img").value = "";
      } else {
        $("img").value = item ? item.img : "";
      }
      $("desc").value = item ? item.desc : "";
      $("formErr").textContent = "";
      updatePreview();
      $("overlay").classList.remove("hidden");
    }

    function closeModal() {
      $("overlay").classList.add("hidden");
      editId = null;
    }

    function updatePreview() {
      const path = photoData || $("img").value.trim();
      const p = $("preview");
      if (path) { p.src = path; p.classList.remove("hidden"); }
      else { p.classList.add("hidden"); }
    }

    function pickPhoto(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          const MAX = 800;
          const scale = Math.min(1, MAX / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(image.width * scale);
          canvas.height = Math.round(image.height * scale);
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          let quality = 0.8;
          let data = canvas.toDataURL("image/jpeg", quality);
          while (data.length > 700000 && quality > 0.4) {
            quality -= 0.1;
            data = canvas.toDataURL("image/jpeg", quality);
          }
          photoData = data;
          $("img").value = "";
          updatePreview();
        };
        image.onerror = () => { $("formErr").textContent = "Could not read that photo. Try another one."; };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    /* ---------- Save / delete ---------- */
    async function saveItem() {
      const title = $("title").value.trim();
      const category = $("category").value;
      const price = parseFloat($("price").value);
      const img = photoData || $("img").value.trim();
      const desc = $("desc").value.trim();

      if (!title || isNaN(price) || !img || !desc) {
        $("formErr").textContent = "Please fill in all fields and add a photo.";
        return;
      }

      const data = { title, category, price, img, desc };
      $("saveBtn").disabled = true;
      try {
        if (editId) {
          await db.collection("menu").doc(editId).set(data, { merge: true });
          toast("Item updated");
        } else {
          await db.collection("menu").add(data);
          toast("Item added");
        }
        closeModal();
      } catch (err) {
        $("formErr").textContent = "Could not save: " + err.message;
      }
      $("saveBtn").disabled = false;
    }

    async function toggleSoldOut(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      try {
        await db.collection("menu").doc(id).update({ soldOut: !item.soldOut });
        toast(item.soldOut ? "Back in stock" : "Marked as sold out");
      } catch (err) {
        toast("Could not update: " + err.message, true);
      }
    }

    async function deleteItem(id) {
      const item = items.find(i => i.id === id);
      if (!confirm('Delete "' + (item ? item.title : "this item") + '"?')) return;
      try {
        await db.collection("menu").doc(id).delete();
        toast("Item deleted");
      } catch (err) {
        toast("Could not delete: " + err.message, true);
      }
    }

    // Never leave a blank page: explain problems on the login screen
    if (location.protocol === "file:") {
      $("loginMsg").textContent = "Open this page from your website link, not from the file on your device.";
    }
    window.addEventListener("error", e => {
      if (!$("loginMsg").textContent) $("loginMsg").textContent = "Something went wrong: " + e.message;
    });

    async function importStarter() {
      try {
        const batch = db.batch();
        starterItems.forEach(item => batch.set(db.collection("menu").doc(), item));
        await batch.commit();
        toast("Starter menu imported");
      } catch (err) {
        toast("Could not import: " + err.message, true);
      }
    }
  </script>
</body>
</html>
